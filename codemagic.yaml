workflows:
  ios-dev:
    name: Receipt Scanner iOS (development)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        provisioning_profiles:
          - ios_profile
        certificates:
          - app_cert
      vars:
        XCODE_PROJECT: apps/mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: ma.oasisnest.screenshotcleaner
        DEVELOPMENT_TEAM: U3V77CWH3F
      node: 20.11.1
    scripts:
      - name: Enable pnpm
        script: |
          corepack enable
          # packageManager field in root package.json pins pnpm; just prime the cache
          corepack prepare --activate
          pnpm --version

      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Build mobile web assets
        script: |
          pnpm --filter mobile run build

      - name: Capacitor add + sync iOS
        working_directory: apps/mobile
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Materialize Capacitor symlinks for SPM
        working_directory: apps/mobile
        script: |
          # pnpm leaves node_modules/@capacitor/* as symlinks into .pnpm/
          # Capacitor's generated Package.swift uses relative paths that break
          # under symlinks with Xcode's explicit module build. Replace symlinks
          # with real directory copies so SPM sees stable, resolvable paths.
          for pkg in node_modules/@capacitor/*; do
            if [ -L "$pkg" ]; then
              target=$(readlink "$pkg")
              real=$(cd "$(dirname "$pkg")" && cd "$target" && pwd)
              rm "$pkg"
              cp -R "$real" "$pkg"
              echo "Materialized $pkg from $real"
            fi
          done
          for pkg in node_modules/@capacitor-community/*; do
            if [ -L "$pkg" ]; then
              target=$(readlink "$pkg")
              real=$(cd "$(dirname "$pkg")" && cd "$target" && pwd)
              rm "$pkg"
              cp -R "$real" "$pkg"
              echo "Materialized $pkg from $real"
            fi
          done
          echo "--- Capacitor SPM structure ---"
          ls -la ios/App/CapApp-SPM/ 2>/dev/null || echo "No CapApp-SPM dir"
          cat ios/App/CapApp-SPM/Package.swift 2>/dev/null || echo "No Package.swift"
          echo "--- node_modules/@capacitor ---"
          ls -la node_modules/@capacitor/ 2>/dev/null || true

      - name: Patch Info.plist (bundle id, camera/photos usage)
        working_directory: apps/mobile/ios/App
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to scan your receipts'" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Used to scan your receipts'" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to import receipts from your gallery'" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Used to import receipts from your gallery'" App/Info.plist

      - name: Set bundle id + team in Xcode project
        working_directory: apps/mobile/ios/App
        script: |
          sed -i.bak -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          sed -i.bak -E "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" App.xcodeproj/project.pbxproj
          # Capacitor's template may not have DEVELOPMENT_TEAM at all — ensure one line per buildSettings block
          if ! grep -q "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj; then
            sed -i.bak -E "s/(PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;)/\1\n\t\t\t\tDEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" App.xcodeproj/project.pbxproj
          fi
          rm -f App.xcodeproj/project.pbxproj.bak

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Resolve SPM packages
        working_directory: apps/mobile/ios/App
        script: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ./spm-cache

      - name: Build iOS archive
        working_directory: apps/mobile/ios/App
        script: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ./spm-cache \
            -skipPackagePluginValidation \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO

      - name: Export IPA
        script: |
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist /tmp/exportOptions.plist

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive

    publishing:
      email:
        recipients:
          - saad.hdia@gmail.com
        notify:
          success: true
          failure: true
